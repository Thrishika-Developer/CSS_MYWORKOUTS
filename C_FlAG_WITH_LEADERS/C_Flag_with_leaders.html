<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>Flag with leaders page</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='./CSS/C_Flag_with_leaders.css'>
</head>
<body>
    <!-- India -->
    <div class="india">
        <div class="indianflag">
        <img src=".//IMAGE/Indian_flag.png" alt="indianflag">
        </div>
        <div class="one">
        <div class="indianflagmassage">INDIA</div>
        <span id="head1">~ Narendra Modi</span>
        <img src="./IMAGE/Indian_head.jpeg" alt="indianhead">
        </div>
    </div>
    <br><br>
    <!-- United states -->
     <div class="unitedstates">
        <div class="unitedstatesflag">
        <img src="./IMAGE/Unitedstate_flag.png" alt="unitedstatesflag">
        </div>
        <div class="two">
        <div class="unitedstatesflagmassage">UNITED STATES</div>
        <span id="head2">~ Joe Biden</span>
        <img src="./IMAGE/Unitedstate_head.jpeg" alt="unitedstateshead">
        </div>
    </div>
    <br><br>
    <!-- United kingdom -->
     <div class="unitedkingdom">
        <div class="unitedkingdomflag">
        <img src="./IMAGE/Unitedkingdom_flag.png" alt="unitedkingdomflag">
        </div>
        <div class="three">
        <div class="unitedkingdomflagmassage">UNITED KINGDOM</div>
        <span id="head1">~ Rishi Sunak</span>
        <img src="./IMAGE/Unitedkingdom_head.jpeg" alt="unitedkingdomhead">
        </div>
    </div>
    <br><br>
    <!-- Canada -->
     <div class="canada">
        <div class="canadaflag">
        <img src="./IMAGE/Canada_flag.png" alt="canadaflag">
        </div>
        <div class="four">
        <div class="canadaflagmassage">CANADA</div>
        <span id="head2">~ Justin Trudeau</span>
        <img src="./IMAGE/Canada_head.jpeg" alt="canadahead">
        </div>
    </div>
    <br><br>
    <!-- Australia-->
    <div class="australia">
        <div class="australiaflag">
        <img src="./IMAGE/Australia_flag.png" alt="australiaflag">
        </div>
        <div class="five">
        <div class="australiaflagmassage">AUSTRALIA</div>
        <span id="head1">~ Anthony Albanese</span>
        <img src="./IMAGE/Australia_head.jpeg" alt="australiahead">
        </div>
    </div>
   

    
</body>
</html>
